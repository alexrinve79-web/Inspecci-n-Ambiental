<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v13 TODO ADENTRO</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f2f0eb;font-family:Arial,sans-serif;padding-bottom:90px}.header{background:#1a4d2e;color:#fff;padding:14px;display:flex;justify-content:space-between}.badge{background:#fff;color:#1a4d2e;padding:5px 10px;border-radius:6px;font-weight:800;font-size:11px}.page{padding:12px;max-width:600px;margin:auto}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.input{width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;background:#f9fafb;font-size:14px}label{font-size:12px;font-weight:700}.btn-green{background:#1a4d2e;color:#fff;font-weight:700;padding:13px;border:none;border-radius:10px;width:100%}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex}.bottomnav button{flex:1;padding:15px;border:none;background:#fff;font-weight:700}.tab-active{background:#1a4d2e!important;color:#fff!important}.hidden{display:none!important}.sev{flex:1;border:1px solid #ddd;border-radius:999px;padding:9px;background:#fff}.sev-on{background:#1a4d2e!important;color:#fff!important}</style></head>
<body>
<header class="header"><div><h1>🌿 Inspecciones v13</h1><p>Todo en un archivo - SI FUNCIONA</p></div><span class="badge">ADMIN</span></header>
<div id="p1" class="page"><div class="card"><h2>Información General</h2><label>Área / Planta</label><select id="planta" class="input"></select><label>Subárea</label><select id="subarea" class="input"></select><label>Responsable</label><select id="responsable" class="input"></select><label>Correo</label><input id="correo" class="input"><label>Fecha</label><input id="fecha" type="date" class="input"><button onclick="showStep(2)" class="btn-green">Continuar →</button></div></div>
<div id="p2" class="page hidden"><div class="card"><h2>Hallazgo</h2><textarea id="desc" class="input" placeholder="Describe hallazgo"></textarea><div style="display:flex;gap:8px"><button onclick="setSev('Leve')" id="sLeve" class="sev">Leve</button><button onclick="setSev('Medio')" id="sMedio" class="sev">Medio</button><button onclick="setSev('Critico')" id="sCrit" class="sev">Crítico</button></div><button onclick="guardarTodo()" class="btn-green">💾 GUARDAR INSPECCIÓN</button><div id="listaTemp"></div></div></div>
<div id="p3" class="page hidden"><div class="card"><h2>Dashboard</h2><div id="listaAll"></div></div></div>
<nav class="bottomnav"><button id="b1" onclick="showStep(1)" class="tab-active">Inicio</button><button id="b2" onclick="showStep(2)">Inspecciones</button><button id="b3" onclick="showStep(3)">Admin</button></nav>
<script>
let DB={divisiones:["Acería","Laminación"],areas:{"Acería":["Horno","Colada","Ajuste"],"Laminación":["Tren 1","Tren 2"]},responsables:{"Horno":["Juan Perez"],"Colada":["Ana Gomez"]},correos:{"Juan Perez":"juan@empresa.com","Ana Gomez":"ana@empresa.com"},inspecciones:JSON.parse(localStorage.getItem('inspDB')||'[]')};
let sevSel='Leve';
function $(id){return document.getElementById(id)}
function init(){
  $('fecha').value=new Date().toISOString().slice(0,10);
  $('planta').innerHTML=DB.divisiones.map(d=>`<option>${d}</option>`).join('');
  $('planta').onchange=cargarSub; $('subarea').onchange=asignarResp; $('responsable').onchange=asignarCorreo;
  cargarSub(); renderDash();
}
function cargarSub(){let subs=DB.areas[$('planta').value]||[];$('subarea').innerHTML=subs.map(s=>`<option>${s}</option>`).join('');asignarResp();}
function asignarResp(){let r=DB.responsables[$('subarea').value]||["Sin asignar"];$('responsable').innerHTML=r.map(x=>`<option>${x}</option>`).join('');asignarCorreo();}
function asignarCorreo(){$('correo').value=DB.correos[$('responsable').value]||"";}
function showStep(n){['p1','p2','p3'].forEach((id,i)=>$(id).classList.toggle('hidden',i!==(n-1)));['b1','b2','b3'].forEach((id,i)=>$(id).classList.toggle('tab-active',i===(n-1)));if(n===3)renderDash();}
function setSev(s){sevSel=s;['sLeve','sMedio','sCrit'].forEach(id=>$(id).classList.remove('sev-on'));if(s==='Leve')$('sLeve').classList.add('sev-on');if(s==='Medio')$('sMedio').classList.add('sev-on');if(s==='Critico')$('sCrit').classList.add('sev-on');}
function guardarTodo(){let insp={div:$('planta').value,area:$('subarea').value,resp:$('responsable').value,fecha:$('fecha').value,desc:$('desc').value,sev:sevSel};DB.inspecciones.push(insp);localStorage.setItem('inspDB',JSON.stringify(DB.inspecciones));alert('Guardado: '+insp.div+' - '+insp.area);renderDash();showStep(3);}
function renderDash(){$('listaAll').innerHTML=DB.inspecciones.map(i=>`<div style="border:1px solid #ddd;padding:10px;border-radius:8px;margin-top:6px"><b>${i.div} - ${i.area}</b><br>${i.resp} - ${i.fecha}<br>${i.desc} [${i.sev}]</div>`).join('')||'Sin inspecciones aún';}
init();
</script>
</body></html>
