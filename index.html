<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123F22">
<title>Inspección Ambiental</title>
<style>
:root{--green:#123F22;--green2:#1e6336;--mint:#eaf4ec;--bg:#f4f7f4;--ink:#17251b;--muted:#718075;--line:#e2e9e3;--white:#fff;--red:#c83d3d;--yellow:#c58b16;--shadow:0 8px 28px rgba(18,63,34,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#e8f1e9,#f8faf8)}.login-card{width:min(100%,430px);background:#fff;border-radius:28px;padding:32px;box-shadow:var(--shadow)}.brand{text-align:center;margin-bottom:26px}.shield{width:76px;height:76px;border-radius:24px;background:var(--green);display:grid;place-items:center;margin:0 auto 15px;color:#fff;font-size:37px}.brand h1{font-size:25px;margin:0;color:var(--green)}.brand p{color:var(--muted);margin:8px 0 0}.badge{display:inline-flex;align-items:center;gap:6px;background:#e8f2e9;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.09em;padding:7px 12px;border-radius:30px}.role-toggle{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#f0f4f0;border-radius:13px;margin:20px 0}.role-toggle button{border:0;background:transparent;padding:11px;border-radius:10px;color:var(--muted);font-weight:700}.role-toggle button.active{background:#fff;color:var(--green);box-shadow:0 2px 8px #123f2214}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;outline:none;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#4b8b5d;box-shadow:0 0 0 3px #1e633612}.field textarea{min-height:94px;resize:vertical}.input-row{display:flex;gap:8px}.input-row input{flex:1}.eye{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 13px}.inline-between{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin:14px 0}.check{display:flex;gap:8px;align-items:center;color:var(--muted)}.link{border:0;background:none;color:var(--green2);font-weight:700;padding:0}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:800;display:inline-flex;justify-content:center;align-items:center;gap:8px}.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green2)}.btn-light{background:var(--mint);color:var(--green)}.btn-danger{background:#fff0f0;color:var(--red)}.btn-block{width:100%;margin-top:10px}.muted{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}.muted button{font-size:13px}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:5}.topbrand{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:850}.mini-shield{width:39px;height:39px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:20px}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--green);font-weight:800}.container{max-width:1180px;margin:28px auto;padding:0 22px 105px}.page-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.page-title h2{font-size:25px;margin:0 0 5px;color:var(--green)}.page-title p{margin:0;color:var(--muted);font-size:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 4px 18px #123f2207;margin-bottom:18px}.stepper{display:flex;align-items:center;gap:10px;margin-bottom:22px}.step{display:flex;align-items:center;gap:8px;color:#8a978d;font-size:13px;font-weight:700}.step b{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#e9eeea}.step.active{color:var(--green)}.step.active b,.step.done b{background:var(--green);color:#fff}.step-line{height:1px;background:var(--line);flex:1;max-width:70px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}.section-head{font-size:16px;color:var(--green);font-weight:850;margin:0 0 16px}.responsible{background:var(--mint);border:1px solid #d7e8da;border-radius:14px;padding:13px 15px;margin:8px 0 15px}.responsible strong{display:block;color:var(--green);font-size:14px}.responsible small{color:#52715a}.footer-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.photo-box{border:1.5px dashed #b9cbbb;border-radius:15px;padding:18px;text-align:center;background:#fbfdfb;color:var(--muted)}.photo-box input{max-width:100%;margin-top:10px}.preview{max-width:100%;max-height:210px;border-radius:12px;margin-top:12px;object-fit:cover}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:30px;font-size:13px;font-weight:750;color:var(--muted)}.pill.selected{background:var(--mint);border-color:#9dc5a5;color:var(--green)}.list-item{border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;gap:13px;align-items:center;margin:10px 0}.thumb{width:58px;height:58px;border-radius:11px;object-fit:cover;background:var(--mint);display:grid;place-items:center;color:var(--green);flex-shrink:0}.list-item strong{font-size:14px}.list-item small{display:block;color:var(--muted);margin-top:4px}.list-item .grow{flex:1;min-width:0}.severity{font-size:11px;font-weight:800;border-radius:30px;padding:6px 9px}.sev-Leve{background:#e8f5e9;color:#28743a}.sev-Medio{background:#fff4d9;color:#986b09}.sev-Crítico{background:#ffe7e7;color:#b42e2e}.banner{background:linear-gradient(120deg,#123f22,#27683b);color:#fff;border-radius:22px;padding:25px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.banner h2{margin:8px 0;font-size:24px}.banner p{margin:0;color:#d7e8da;font-size:14px}.banner .badge{background:#ffffff22;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.stat small{color:var(--muted);font-weight:650}.stat strong{display:block;font-size:27px;color:var(--green);margin-top:7px}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end}.filters .field{margin:0}.filters .field label{font-size:11px}.filters input,.filters select{padding:10px;font-size:12px}.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.bar-row{display:grid;grid-template-columns:125px 1fr 35px;gap:10px;align-items:center;margin:14px 0;font-size:12px}.bar-track{height:10px;background:#edf2ed;border-radius:20px;overflow:hidden}.bar-fill{height:100%;background:#39844d;border-radius:20px}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:22px;min-height:180px}.donut{width:145px;height:145px;border-radius:50%;background:conic-gradient(#2d8145 0 55%,#e8b84c 55% 82%,#d85a5a 82%);position:relative}.donut:after{content:"";position:absolute;inset:28px;background:#fff;border-radius:50%}.legend{font-size:12px;color:var(--muted);line-height:2}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.score{font-weight:900;font-size:17px}.score.good{color:#258044}.score.mid{color:#b17b13}.score.bad{color:#c33b3b}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:800;background:#fbfcfb}td{color:#35443a}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.manage-box{border:1px solid var(--line);border-radius:15px;padding:15px}.manage-box h4{margin:0 0 10px;color:var(--green)}.manage-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #f0f3f0;font-size:12px}.manage-row:last-child{border:0}.manage-row button{border:0;background:none;color:var(--green2);font-weight:800}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:8;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #123f2208}.nav-inner{width:min(700px,100%);display:flex;justify-content:space-around}.nav-btn{border:0;background:none;color:#89958c;font-size:10px;font-weight:750;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 13px}.nav-btn span{font-size:20px}.nav-btn.active{color:var(--green)}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#173f25;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:var(--shadow);font-size:13px}.empty{text-align:center;padding:25px;color:var(--muted)}.hidden-file{display:none}
@media(max-width:760px){.container{margin:20px auto;padding:0 14px 105px}.topbar{padding:0 15px;height:62px}.page-title h2{font-size:21px}.grid2,.grid3,.dash-grid,.admin-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .field:last-child{grid-column:span 2}.banner{padding:20px}.banner h2{font-size:21px}.card{padding:17px}.step{font-size:11px;gap:5px}.step-line{max-width:20px}.footer-actions .btn{flex:1;padding:12px 8px;font-size:12px}.login-card{padding:25px 21px}.topbrand{font-size:13px}}
</style>
</head>
<body>
<div id="login" class="login-wrap">
 <div class="login-card">
  <div class="brand"><div class="shield">🌿</div><h1>Inspección Ambiental</h1><p>Inicia sesión para continuar</p><div style="margin-top:13px"><span class="badge">● ADMINISTRACIÓN AMBIENTAL</span></div></div>
  <div class="role-toggle"><button id="roleUser" class="active" onclick="setRole('Usuario')">Usuario</button><button id="roleAdmin" onclick="setRole('Admin')">Admin</button></div>
  <form id="loginForm">
   <div class="field"><label>Correo electrónico</label><input id="loginEmail" type="email" placeholder="nombre@empresa.com" required></div>
   <div class="field"><label>Contraseña</label><div class="input-row"><input id="loginPass" type="password" placeholder="Ingresa tu contraseña" required><button type="button" class="eye" onclick="togglePass()">◉</button></div></div>
   <div id="adminKeyWrap" class="field hidden"><label>Clave de administrador</label><input id="adminKey" type="password" placeholder="Clave admin"></div>
   <div class="inline-between"><label class="check"><input type="checkbox" id="keepSession" checked> Mantener sesión iniciada</label><button type="button" class="link" onclick="forgot()">¿Olvidaste tu contraseña?</button></div>
   <button class="btn btn-primary btn-block" type="submit">Ingresar →</button>
  </form>
  <div class="muted">¿No tienes una cuenta? <button class="link" onclick="register()">Regístrate aquí</button></div>
  <p class="muted" style="font-size:11px">Demo local · Los datos se guardan en este dispositivo</p>
 </div>
</div>
<div id="app" class="app hidden">
 <header class="topbar"><div class="topbrand"><div class="mini-shield">🌿</div> Inspección Ambiental</div><div class="top-actions"><span id="topRole" class="badge">USUARIO</span><div id="topAvatar" class="avatar">US</div></div></header>
 <main id="screen" class="container"></main>
 <nav class="bottomnav"><div class="nav-inner">
  <button class="nav-btn active" onclick="go('home',this)"><span>⌂</span>Inicio</button>
  <button class="nav-btn" onclick="go('inspections',this)"><span>▤</span>Inspecciones</button>
  <button class="nav-btn admin-only" onclick="go('stats',this)"><span>▥</span>Estadísticas</button>
  <button class="nav-btn admin-only" onclick="go('admin',this)"><span>⚙</span>Admin</button>
  <button class="nav-btn" onclick="go('profile',this)"><span>●</span>Perfil</button>
 </div></nav>
</div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const ADMIN_KEY='ADMIN2024'; // Cambia esta clave antes de publicar. En GitHub Pages no es un secreto seguro.
const seed={
 divisions:['Operaciones Mineras','Acería','Laminación','Servicios Generales'],
 areas:{'Operaciones Mineras':['Planta Norte','Almacén Central','Zona Norte'],'Acería':['Horno Eléctrico','Colada Continua','Ajuste','Patio Chatarra'],'Laminación':['Tren 1','Tren 2','Horno Recalentamiento'],'Servicios Generales':['PTAR','Almacén','Talleres']},
 people:[
 {name:'María López',email:'maria@empresa.com',areas:['Planta Norte','Almacén Central','Zona Norte']},
 {name:'Juan Perez',email:'juan@empresa.com',areas:['Horno Eléctrico']},{name:'Ana Gomez',email:'ana@empresa.com',areas:['Colada Continua']},{name:'Luis Torres',email:'luis@empresa.com',areas:['Ajuste']},{name:'Pedro Diaz',email:'pedro@empresa.com',areas:['Patio Chatarra']},
 {name:'Maria Lopez',email:'maria@empresa.com',areas:['Tren 1']},{name:'Carlos Ruiz',email:'carlos@empresa.com',areas:['Tren 2']},{name:'Jorge Ramirez',email:'jorge@empresa.com',areas:['Horno Recalentamiento']},
 {name:'Laura Mendez',email:'laura@empresa.com',areas:['PTAR']},{name:'Diego Soto',email:'diego@empresa.com',areas:['Almacén']},{name:'Andres Paredes',email:'andres@empresa.com',areas:['Talleres']}
 ],
 inspectors:[{name:'Inspector Ambiental',email:'inspector@empresa.com'}]
};
let db=JSON.parse(localStorage.getItem('ia_db')||'null')||{...seed,inspections:[],nextId:88};
if(!db.areas)db.areas=seed.areas;if(!db.people)db.people=seed.people;if(!db.inspectors)db.inspectors=seed.inspectors;if(!db.inspections)db.inspections=[];
let role='Usuario',user=null,view='home',draft=null,editingFinding=null,filters={};
function save(){localStorage.setItem('ia_db',JSON.stringify(db))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function setRole(r){role=r;document.getElementById('roleUser').classList.toggle('active',r==='Usuario');document.getElementById('roleAdmin').classList.toggle('active',r==='Admin');document.getElementById('adminKeyWrap').classList.toggle('hidden',r!=='Admin')}
function togglePass(){let p=document.getElementById('loginPass');p.type=p.type==='password'?'text':'password'}
function forgot(){alert('Contacta al administrador de la plataforma para restablecer tu contraseña.')}
function register(){let email=prompt('Correo electrónico de la cuenta:');if(!email)return;let name=prompt('Nombre completo:');if(!name)return;let pass=prompt('Crea una contraseña:');if(!pass)return;let users=JSON.parse(localStorage.getItem('ia_users')||'{}');if(users[email])return alert('Ese correo ya está registrado.');users[email]={name,pass};localStorage.setItem('ia_users',JSON.stringify(users));alert('Cuenta creada. Ya puedes ingresar.')}
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();let email=document.getElementById('loginEmail').value.trim().toLowerCase(),pass=document.getElementById('loginPass').value;let users=JSON.parse(localStorage.getItem('ia_users')||'{}');if(role==='Admin'){if(document.getElementById('adminKey').value!==ADMIN_KEY)return alert('Clave de administrador incorrecta.');user={name:'Administrador',email,role:'Admin'}}else{if(!email||!pass)return;let account=users[email];if(account&&account.pass!==pass)return alert('Contraseña incorrecta.');user={name:account?.name||email.split('@')[0],email,role:'Usuario'}}localStorage.setItem('ia_session',JSON.stringify({user,keep:document.getElementById('keepSession').checked}));startApp()});
function startApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('topRole').textContent=user.role.toUpperCase();document.getElementById('topAvatar').textContent=user.role==='Admin'?'AD':user.name.slice(0,2).toUpperCase();document.querySelectorAll('.admin-only').forEach(x=>x.classList.toggle('hidden',user.role!=='Admin'));go('home')}
let session=JSON.parse(localStorage.getItem('ia_session')||'null');if(session?.keep){user=session.user;startApp()}
function go(v,el){if(user.role!=='Admin'&&['stats','admin'].includes(v))v='home';view=v;document.querySelectorAll('.nav-btn').forEach(n=>n.classList.remove('active'));if(el)el.classList.add('active');else{let ix={home:0,inspections:1,stats:2,admin:3,profile:4}[v];document.querySelectorAll('.nav-btn')[ix]?.classList.add('active')}render()}
function render(){let s=document.getElementById('screen');if(view==='home')s.innerHTML=homeHTML();if(view==='new1')s.innerHTML=step1HTML();if(view==='new2')s.innerHTML=step2HTML();if(view==='plan')s.innerHTML=planHTML();if(view==='inspections')s.innerHTML=inspectionsHTML();if(view==='stats')s.innerHTML=statsHTML();if(view==='admin')s.innerHTML=adminHTML();if(view==='profile')s.innerHTML=profileHTML();if(view==='detail')s.innerHTML=detailHTML()}
function homeHTML(){let mine=visibleInspections();return `<div class="page-title"><div><h2>Hola, ${esc(user.name)} 👋</h2><p>Bienvenido al sistema de Inspección Ambiental</p></div>${user.role==='Admin'?'<span class="badge">ADMIN</span>':''}</div><div class="banner"><div><span class="badge">GESTIÓN AMBIENTAL</span><h2>Protejamos nuestro entorno</h2><p>Registra, gestiona y realiza seguimiento a los hallazgos ambientales.</p></div><div style="font-size:48px">🌱</div></div><div class="stats"><div class="stat"><small>Inspecciones</small><strong>${mine.length}</strong></div><div class="stat"><small>Hallazgos</small><strong>${mine.reduce((a,x)=>a+x.findings.length,0)}</strong></div><div class="stat"><small>En seguimiento</small><strong>${mine.filter(x=>x.status!=='Cerrada').length}</strong></div><div class="stat"><small>Puntaje promedio</small><strong>${mine.length?Math.round(mine.reduce((a,x)=>a+x.score,0)/mine.length):'—'}</strong></div></div><div class="card"><h3 class="section-head">Acciones rápidas</h3><div class="grid2"><button class="btn btn-primary" onclick="newInspection()">＋ Nueva inspección</button><button class="btn btn-light" onclick="go('inspections')">▤ Ver inspecciones</button></div></div>${user.role==='Admin'?'<div class="card"><h3 class="section-head">Panel de administración</h3><p style="color:var(--muted);font-size:13px">Consulta indicadores, administra catálogos y exporta reportes.</p><button class="btn btn-light" onclick="go(\\'stats\\')">Ver dashboard →</button></div>':''}`}
function newInspection(){draft={id:'INS-2024-'+String(db.nextId++).padStart(3,'0'),date:new Date().toISOString().slice(0,10),division:'',area:'',responsible:null,inspector:user.name,inspectorEmail:user.email,findings:[],status:'Abierta'};save();go('new1')}
function steps(n){return `<div class="stepper"><div class="step ${n>=1?'active':''}"><b>1</b> Información</div><div class="step-line"></div><div class="step ${n>=2?'active':''}"><b>2</b> Hallazgos</div><div class="step-line"></div><div class="step ${n>=3?'active':''}"><b>3</b> Plan de acción</div></div>`}
function step1HTML(){return `<div class="page-title"><div><h2>Nueva Inspección Ambiental</h2><p>Paso 1 de 3 · Información general</p></div></div>${steps(1)}<div class="card"><h3 class="section-head">Información general</h3><div class="grid2"><div class="field"><label>División *</label><select id="division" onchange="divisionChanged()"><option value="">Seleccionar división</option>${db.divisions.map(x=>`<option ${draft.division===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Área *</label><select id="area" onchange="areaChanged()"><option value="">Seleccionar área</option>${(db.areas[draft.division]||[]).map(x=>`<option ${draft.area===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div id="responsibleBox">${responsibleHTML()}</div><div class="grid2"><div class="field"><label>Inspector</label><input value="${esc(draft.inspector)}" id="inspectorName"></div><div class="field"><label>Correo del inspector</label><input type="email" value="${esc(draft.inspectorEmail)}" id="inspectorEmail"></div><div class="field"><label>ID de inspección</label><input value="${draft.id}" disabled></div><div class="field"><label>Fecha</label><input id="inspectionDate" type="date" value="${draft.date}"></div></div><div class="footer-actions"><button class="btn btn-light" onclick="go('home')">Cancelar</button><button class="btn btn-primary" onclick="continueStep1()">Continuar →</button></div></div>`}
function responsibleHTML(){let p=db.people.find(x=>x.areas.includes(draft.area));draft.responsible=p||null;return p?`<div class="responsible"><small>RESPONSABLE AUTOMÁTICO DEL ÁREA</small><strong>♙ ${esc(p.name)}</strong><small>✉ ${esc(p.email)}</small></div>`:draft.area?'<div class="responsible"><strong>⚠ No hay responsable configurado para esta área</strong><small>Solicita al administrador asignar un responsable antes de continuar.</small></div>':'<div class="responsible"><small>Selecciona un área para cargar su responsable automáticamente.</small></div>'}
function divisionChanged(){draft.division=document.getElementById('division').value;draft.area='';render()}
function areaChanged(){draft.area=document.getElementById('area').value;render()}
function continueStep1(){draft.division=document.getElementById('division').value;draft.area=document.getElementById('area').value;draft.inspector=document.getElementById('inspectorName').value;draft.inspectorEmail=document.getElementById('inspectorEmail').value;draft.date=document.getElementById('inspectionDate').value;draft.responsible=db.people.find(x=>x.areas.includes(draft.area));if(!draft.division||!draft.area||!draft.responsible)return toast('Selecciona división, área y un responsable configurado.');go('new2')}
let findingForm={photo:'',description:'',severity:'Leve',location:['Planta','Zona de carga','Área exterior'],type:'Residuos'};
function step2HTML(){return `<div class="page-title"><div><h2>Hallazgos</h2><p>Paso 2 de 3 · Registra las condiciones identificadas</p></div></div>${steps(2)}<div class="card"><h3 class="section-head">Agregar hallazgo</h3><div class="photo-box">📷 <strong>Agregar fotografía</strong><br><small>Selecciona una imagen desde tu dispositivo</small><input type="file" accept="image/*" id="findingPhoto" onchange="photoPreview(event)"><div id="photoPreview">${findingForm.photo?`<img class="preview" src="${findingForm.photo}">`:''}</div></div><div class="field"><label>Descripción del hallazgo *</label><textarea id="findingDescription" placeholder="Describe claramente la situación encontrada...">${esc(findingForm.description)}</textarea></div><div class="field"><label>Severidad</label><div class="pills">${['Leve','Medio','Crítico'].map(x=>`<button class="pill ${findingForm.severity===x?'selected':''}" onclick="setSeverity('${x}')">${x} · ${{Leve:'0.5',Medio:'1',Crítico:'2'}[x]}</button>`).join('')}</div></div><div class="field"><label>Ubicación · Nivel 1</label><select id="loc1" onchange="locationChanged(1)">${['Planta','Patio','Taller','PTAR'].map(x=>`<option ${findingForm.location[0]===x?'selected':''}>${x}</option>`)}</select></div><div class="grid2"><div class="field"><label>Zona · Nivel 2</label><select id="loc2" onchange="locationChanged(2)">${['Zona de carga','Producción','Almacenamiento','Mantenimiento'].map(x=>`<option ${findingForm.location[1]===x?'selected':''}>${x}</option>`)}</select></div><div class="field"><label>Área específica · Nivel 3</label><select id="loc3" onchange="locationChanged(3)">${['Área exterior','Área interior','Pasillo','Punto de acopio'].map(x=>`<option ${findingForm.location[2]===x?'selected':''}>${x}</option>`)}</select></div></div><div class="field"><label>Tipo de hallazgo</label><select id="findingType" onchange="findingForm.type=this.value">${['Residuos','Derrame','Emisiones','Orden y aseo'].map(x=>`<option ${findingForm.type===x?'selected':''}>${x}</option>`)}</select></div><button class="btn btn-primary btn-block" onclick="saveFinding()">＋ Guardar hallazgo y definir plan</button></div><div class="card"><h3 class="section-head">Hallazgos registrados (${draft.findings.length})</h3>${findingsList()}</div><div class="footer-actions"><button class="btn btn-light" onclick="go('new1')">← Atrás</button><button class="btn btn-primary" onclick="finishInspection()">Guardar y finalizar</button></div>`}
function photoPreview(e){let f=e.target.files[0];if(!f)return;if(f.size>1500000){toast('La foto supera 1.5 MB. Selecciona una más pequeña.');e.target.value='';return}let r=new FileReader();r.onload=()=>{findingForm.photo=r.result;document.getElementById('photoPreview').innerHTML=`<img class="preview" src="${r.result}">`};r.readAsDataURL(f)}
function setSeverity(s){findingForm.severity=s;render()}
function locationChanged(n){findingForm.location[n-1]=document.getElementById('loc'+n).value}
function saveFinding(){findingForm.description=document.getElementById('findingDescription').value.trim();findingForm.type=document.getElementById('findingType').value;[1,2,3].forEach(n=>{let el=document.getElementById('loc'+n);if(el)findingForm.location[n-1]=el.value});if(!findingForm.description)return toast('Escribe la descripción del hallazgo.');editingFinding={...findingForm,location:[...findingForm.location]};go('plan')}
function planHTML(){return `<div class="page-title"><div><h2>Plan de Acción</h2><p>Paso 3 de 3 · Define las acciones correctivas</p></div></div>${steps(3)}<div class="card"><h3 class="section-head">Hallazgo y plan de acción</h3>${editingFinding.photo?`<img class="preview" src="${editingFinding.photo}">`:''}<p><strong>${esc(editingFinding.description)}</strong></p><p><span class="severity sev-${editingFinding.severity}">${editingFinding.severity}</span> · ${esc(editingFinding.location.join(' › '))} · ${esc(editingFinding.type)}</p><div class="field"><label>¿Qué se debe hacer? *</label><textarea id="actionText" placeholder="Describe la acción correctiva o preventiva..."></textarea></div><div class="grid2"><div class="field"><label>Responsable del plan</label><select id="planOwner">${db.people.map(p=>`<option ${p.name==='Laura Mendez'?'selected':''}>${esc(p.name)} · ${esc(p.email)}</option>`).join('')}</select></div><div class="field"><label>Fecha compromiso</label><input id="dueDate" type="date" min="${new Date().toISOString().slice(0,10)}"></div></div><div class="footer-actions"><button class="btn btn-light" onclick="go('new2')">← Volver</button><button class="btn btn-primary" onclick="commitFinding()">Guardar hallazgo</button></div></div>`}
function commitFinding(){let action=document.getElementById('actionText').value.trim(),owner=document.getElementById('planOwner').value,due=document.getElementById('dueDate').value;if(!action||!due)return toast('Completa la acción y la fecha compromiso.');editingFinding.action=action;editingFinding.owner=owner;editingFinding.due=due;draft.findings.push(editingFinding);findingForm={photo:'',description:'',severity:'Leve',location:['Planta','Zona de carga','Área exterior'],type:'Residuos'};editingFinding=null;save();go('new2');toast('Hallazgo agregado correctamente.')}
function findingsList(){if(!draft.findings.length)return '<div class="empty">Aún no has registrado hallazgos.</div>';return draft.findings.map((f,i)=>`<div class="list-item">${f.photo?`<img class="thumb" src="${f.photo}">`:'<div class="thumb">🌿</div>'}<div class="grow"><strong>${esc(f.description)}</strong><small>${esc(f.type)} · ${esc(f.location.join(' › '))}</small><small>Plan: ${esc(f.action||'Pendiente')}</small></div><span class="severity sev-${f.severity}">${f.severity}</span><button class="link" onclick="removeDraftFinding(${i})">×</button></div>`).join('')}
function removeDraftFinding(i){draft.findings.splice(i,1);render()}
function finishInspection(){if(!draft.findings.length)return toast('Agrega al menos un hallazgo antes de finalizar.');draft.score=Math.max(0,Math.round(100-draft.findings.reduce((a,f)=>a+({Leve:.5,Medio:1,'Crítico':2}[f.severity]||0),0)));draft.status='Abierta';draft.createdBy=user.email;db.inspections.unshift(JSON.parse(JSON.stringify(draft)));save();draft=null;go('inspections');toast('Inspección guardada correctamente.')}
function visibleInspections(){return user.role==='Admin'?db.inspections:db.inspections.filter(x=>x.createdBy===user.email)}
function inspectionsHTML(){let arr=visibleInspections();return `<div class="page-title"><div><h2>Inspecciones</h2><p>Historial de inspecciones ambientales</p></div><button class="btn btn-primary" onclick="newInspection()">＋ Nueva</button></div><div class="card">${arr.length?arr.map(x=>`<div class="list-item"><div class="thumb">📋</div><div class="grow"><strong>${x.id} · ${esc(x.area)}</strong><small>${esc(x.division)} · ${x.date} · ${x.findings.length} hallazgos</small></div><span class="score ${scoreClass(x.score)}">${x.score}</span><button class="btn btn-light" onclick="openDetail('${x.id}')">Ver</button></div>`).join(''):'<div class="empty">No hay inspecciones registradas. Crea tu primera inspección.</div>'}</div>`}
function scoreClass(n){return n>=80?'good':n>=60?'mid':'bad'}
function openDetail(id){window.currentId=id;go('detail')}
function getCurrent(){return db.inspections.find(x=>x.id===window.currentId)}
function detailHTML(){let x=getCurrent();if(!x)return '<div>Inspección no encontrada</div>';return `<div class="page-title"><div><h2>${x.id}</h2><p>${esc(x.division)} · ${esc(x.area)} · ${x.date}</p></div><button class="btn btn-light" onclick="exportPDF('${x.id}')">⇩ PDF</button></div><div class="card"><div class="grid2"><p><b>Responsable:</b> ${esc(x.responsible?.name||'')}</p><p><b>Inspector:</b> ${esc(x.inspector)}</p><p><b>Puntaje:</b> <span class="score ${scoreClass(x.score)}">${x.score}/100</span></p><p><b>Estado:</b> ${esc(x.status)}</p></div></div><div class="card"><h3 class="section-head">Hallazgos (${x.findings.length})</h3>${x.findings.map(f=>`<div class="list-item">${f.photo?`<img class="thumb" src="${f.photo}">`:'<div class="thumb">🌱</div>'}<div class="grow"><strong>${esc(f.description)}</strong><small>${esc(f.type)} · ${esc(f.location.join(' › '))}</small><small>Acción: ${esc(f.action)} · Responsable: ${esc(f.owner)} · Fecha: ${f.due}</small></div><span class="severity sev-${f.severity}">${f.severity}</span></div>`).join('')}</div><div class="footer-actions"><button class="btn btn-light" onclick="go('inspections')">← Volver</button>${user.role==='Admin'?`<button class="btn btn-light" onclick="editInspection('${x.id}')">Editar</button><button class="btn btn-danger" onclick="deleteInspection('${x.id}')">Eliminar</button>`:''}</div>`}
function statsHTML(){let arr=applyFilters(db.inspections),avg=arr.length?Math.round(arr.reduce((a,x)=>a+x.score,0)/arr.length):0,counts={Leve:0,Medio:0,'Crítico':0};arr.forEach(x=>x.findings.forEach(f=>counts[f.severity]++));let total=Object.values(counts).reduce((a,b)=>a+b,0)||1;let divs=[...new Set(arr.map(x=>x.division))];return `<div class="banner"><div><span class="badge">ADMIN · ESTADÍSTICAS Y GESTIÓN</span><h2>Dashboard Ambiental</h2><p>Modo Administrador Activo · Indicadores y seguimiento</p></div><div style="font-size:42px">📊</div></div><div class="stats"><div class="stat"><small>Inspecciones</small><strong>${arr.length}</strong></div><div class="stat"><small>Puntaje promedio</small><strong>${avg}</strong></div><div class="stat"><small>Hallazgos</small><strong>${Object.values(counts).reduce((a,b)=>a+b,0)}</strong></div><div class="stat"><small>Críticos</small><strong>${counts['Crítico']}</strong></div></div><div class="card"><h3 class="section-head">Filtros de consulta</h3><div class="filters"><div class="field"><label>División</label><select id="fDiv"><option value="">Todas</option>${db.divisions.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Área</label><select id="fArea"><option value="">Todas</option>${Object.values(db.areas).flat().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Responsable</label><select id="fResp"><option value="">Todos</option>${db.people.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Inspector</label><input id="fInspector" placeholder="Nombre"></div><div class="field"><label>Desde / Hasta</label><div style="display:flex;gap:4px"><input type="date" id="fFrom"><input type="date" id="fTo"></div></div></div><button class="btn btn-primary" style="margin-top:13px" onclick="applyDashboardFilters()">Aplicar filtros</button> <button class="btn btn-light" style="margin-top:13px" onclick="clearDashboardFilters()">Limpiar</button></div><div class="dash-grid"><div class="card"><h3 class="section-head">Puntaje por División</h3>${divs.length?divs.map(d=>{let a=arr.filter(x=>x.division===d),v=Math.round(a.reduce((s,x)=>s+x.score,0)/a.length);return `<div class="bar-row"><span>${esc(d)}</span><div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div><b>${v}</b></div>`}).join(''):'<div class="empty">Sin datos</div>'}</div><div class="card"><h3 class="section-head">Distribución de severidad</h3><div class="donut-wrap"><div class="donut" style="background:conic-gradient(#2d8145 0 ${counts.Leve/total*100}%,#e8b84c ${counts.Leve/total*100}% ${(counts.Leve+counts.Medio)/total*100}%,#d85a5a ${(counts.Leve+counts.Medio)/total*100}% 100%)"></div><div class="legend"><div><i style="background:#2d8145"></i>Leve: ${counts.Leve}</div><div><i style="background:#e8b84c"></i>Medio: ${counts.Medio}</div><div><i style="background:#d85a5a"></i>Crítico: ${counts['Crítico']}</div></div></div></div></div><div class="card"><h3 class="section-head">Lista de Inspecciones</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>División / Área</th><th>Responsable</th><th>Inspector</th><th>Fecha</th><th>Puntaje</th><th>Acciones</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${x.id}</td><td>${esc(x.division)}<br>${esc(x.area)}</td><td>${esc(x.responsible?.name||'')}</td><td>${esc(x.inspector)}</td><td>${x.date}</td><td><span class="score ${scoreClass(x.score)}">${x.score}</span><br><small>${x.score>=80?'Excelente':x.score>=60?'Aceptable':'Deficiente'}</small></td><td><button class="link" onclick="openDetail('${x.id}')">Ver</button> <button class="link" onclick="editInspection('${x.id}')">Editar</button> <button class="link" style="color:var(--red)" onclick="deleteInspection('${x.id}')">Eliminar</button> <button class="link" onclick="exportPDF('${x.id}')">PDF</button></td></tr>`).join('')||'<tr><td colspan="7">No hay registros para los filtros seleccionados.</td></tr>'}</tbody></table></div></div>`}
function applyDashboardFilters(){filters={div:document.getElementById('fDiv').value,area:document.getElementById('fArea').value,resp:document.getElementById('fResp').value,inspector:document.getElementById('fInspector').value.toLowerCase(),from:document.getElementById('fFrom').value,to:document.getElementById('fTo').value};render()}
function clearDashboardFilters(){filters={};render()}
function applyFilters(arr){return arr.filter(x=>(!filters.div||x.division===filters.div)&&(!filters.area||x.area===filters.area)&&(!filters.resp||x.responsible?.name===filters.resp)&&(!filters.inspector||x.inspector.toLowerCase().includes(filters.inspector))&&(!filters.from||x.date>=filters.from)&&(!filters.to||x.date<=filters.to))}
function deleteInspection(id){if(!confirm('¿Eliminar definitivamente esta inspección?'))return;db.inspections=db.inspections.filter(x=>x.id!==id);save();go(view==='detail'?'inspections':'stats');toast('Inspección eliminada.')}
function editInspection(id){let x=db.inspections.find(x=>x.id===id);if(!x)return;draft=JSON.parse(JSON.stringify(x));db.inspections=db.inspections.filter(y=>y.id!==id);save();findingForm={photo:'',description:'',severity:'Leve',location:['Planta','Zona de carga','Área exterior'],type:'Residuos'};go('new1');toast('Edición: al finalizar se guardará como una nueva versión.')}
function adminHTML(){return `<div class="page-title"><div><h2>Panel Administrador</h2><p>Gestiona divisiones, áreas, responsables e inspectores</p></div><span class="badge">ADMIN ACTIVO</span></div><div class="card"><h3 class="section-head">Gestionar catálogos</h3><p style="font-size:13px;color:var(--muted)">Los cambios se guardan localmente y se reflejan en los formularios de inspección.</p><div class="admin-grid"><div class="manage-box"><h4>Divisiones</h4>${db.divisions.map((x,i)=>`<div class="manage-row">${esc(x)} <span><button onclick="renameDivision(${i})">Editar</button><button onclick="removeDivision(${i})">×</button></span></div>`).join('')}<button class="btn btn-light" style="margin-top:12px" onclick="addDivision()">＋ Agregar división</button></div><div class="manage-box"><h4>Áreas</h4>${db.divisions.map(d=>`<div style="margin:9px 0"><b style="font-size:12px">${esc(d)}</b>${(db.areas[d]||[]).map((a,i)=>`<div class="manage-row">${esc(a)} <span><button onclick="renameArea('${esc(d)}',${i})">Editar</button><button onclick="removeArea('${esc(d)}',${i})">×</button></span></div>`).join('')}<button class="link" style="margin-top:6px" onclick="addArea('${esc(d)}')">＋ Agregar área</button></div>`).join('')}</div><div class="manage-box"><h4>Responsables</h4>${db.people.map((p,i)=>`<div class="manage-row"><span>${esc(p.name)}<br><small>${esc(p.email)} · ${esc(p.areas.join(', '))}</small></span><button onclick="editPerson(${i})">Editar</button></div>`).join('')}<button class="btn btn-light" style="margin-top:12px" onclick="addPerson()">＋ Agregar responsable</button></div><div class="manage-box"><h4>Inspectores</h4>${db.inspectors.map((p,i)=>`<div class="manage-row">${esc(p.name)} · ${esc(p.email)} <button onclick="editInspector(${i})">Editar</button></div>`).join('')}<button class="btn btn-light" style="margin-top:12px" onclick="addInspector()">＋ Agregar inspector</button></div></div></div><div class="card"><h3 class="section-head">Respaldo de información</h3><p style="font-size:13px;color:var(--muted)">Exporta o restaura los datos de este navegador.</p><button class="btn btn-light" onclick="backup()">⇩ Descargar respaldo JSON</button> <label class="btn btn-light">Importar respaldo<input class="hidden-file" type="file" accept="application/json" onchange="restore(event)"></label></div>`}
function addDivision(){let x=prompt('Nombre de la nueva división:');if(!x)return;if(db.divisions.includes(x))return toast('La división ya existe.');db.divisions.push(x);db.areas[x]=[];save();render()}
function renameDivision(i){let old=db.divisions[i],x=prompt('Nuevo nombre:',old);if(!x)return;db.divisions[i]=x;db.areas[x]=db.areas[old]||[];delete db.areas[old];save();render()}
function removeDivision(i){let d=db.divisions[i];if(!confirm('¿Eliminar división y sus áreas?'))return;db.divisions.splice(i,1);delete db.areas[d];save();render()}
function addArea(d){let x=prompt('Nombre del área para '+d+':');if(!x)return;(db.areas[d]||(db.areas[d]=[])).push(x);save();render()}
function renameArea(d,i){let old=db.areas[d][i],x=prompt('Nuevo nombre:',old);if(!x)return;db.areas[d][i]=x;db.people.forEach(p=>p.areas=p.areas.map(a=>a===old?x:a));save();render()}
function removeArea(d,i){let a=db.areas[d][i];if(!confirm('¿Eliminar área '+a+'?'))return;db.areas[d].splice(i,1);db.people.forEach(p=>p.areas=p.areas.filter(x=>x!==a));save();render()}
function editPerson(i){let p=db.people[i],name=prompt('Nombre:',p.name);if(!name)return;let email=prompt('Correo:',p.email);if(!email)return;let areas=prompt('Áreas asignadas (separadas por coma):',p.areas.join(', '));db.people[i]={name,email,areas:areas.split(',').map(x=>x.trim()).filter(Boolean)};save();render()}
function addPerson(){let name=prompt('Nombre del responsable:');if(!name)return;let email=prompt('Correo electrónico:');if(!email)return;let areas=prompt('Áreas asignadas, separadas por coma:');db.people.push({name,email,areas:(areas||'').split(',').map(x=>x.trim()).filter(Boolean)});save();render()}
function editInspector(i){let p=db.inspectors[i],name=prompt('Nombre:',p.name);if(!name)return;let email=prompt('Correo:',p.email);if(!email)return;db.inspectors[i]={name,email};save();render()}
function addInspector(){let name=prompt('Nombre del inspector:');if(!name)return;let email=prompt('Correo electrónico:');if(!email)return;db.inspectors.push({name,email});save();render()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo-inspeccion-ambiental.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.inspections||!x.areas)throw 0;db=x;save();toast('Respaldo restaurado.');render()}catch{alert('Archivo de respaldo no válido.')}};r.readAsText(f)}
function profileHTML(){return `<div class="page-title"><div><h2>Mi perfil</h2><p>Información de la sesión actual</p></div></div><div class="card"><div class="avatar" style="width:65px;height:65px;font-size:22px;margin-bottom:15px">${user.role==='Admin'?'AD':user.name.slice(0,2).toUpperCase()}</div><h3>${esc(user.name)}</h3><p style="color:var(--muted)">${esc(user.email)}</p><span class="badge">${user.role.toUpperCase()}</span><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><button class="btn btn-danger" onclick="logout()">Cerrar sesión</button></div>`}
function logout(){localStorage.removeItem('ia_session');user=null;location.reload()}
function exportPDF(id){let x=db.inspections.find(z=>z.id===id);if(!x)return;if(!window.jspdf){return alert('No se pudo cargar jsPDF. Revisa tu conexión a internet.')}let {jsPDF}=window.jspdf,doc=new jsPDF();doc.setFontSize(18);doc.setTextColor(18,63,34);doc.text('Inspección Ambiental',14,18);doc.setFontSize(11);doc.setTextColor(50);let lines=[`ID: ${x.id}`,`División: ${x.division}`,`Área: ${x.area}`,`Responsable: ${x.responsible?.name||''} (${x.responsible?.email||''})`,`Inspector: ${x.inspector} (${x.inspectorEmail})`,`Fecha: ${x.date}`,`Puntaje: ${x.score}/100 (${x.score>=80?'Excelente':x.score>=60?'Aceptable':'Deficiente'})`,`Estado: ${x.status}`];let y=30;lines.forEach(t=>{doc.text(t,14,y);y+=7});y+=4;doc.setFontSize(14);doc.text('Hallazgos y planes de acción',14,y);y+=9;doc.setFontSize(10);x.findings.forEach((f,i)=>{let txt=`${i+1}. ${f.description} | ${f.severity} | ${f.type}\nUbicación: ${f.location.join(' > ')}\nAcción: ${f.action}\nResponsable: ${f.owner} | Fecha compromiso: ${f.due}`;let split=doc.splitTextToSize(txt,180);if(y+split.length*5>275){doc.addPage();y=20}doc.text(split,14,y);y+=split.length*5+6});doc.save(`${x.id}-inspeccion-ambiental.pdf`)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body></html>
