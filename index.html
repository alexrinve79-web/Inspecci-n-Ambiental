<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspecciones v7 CSS</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><link rel="stylesheet" href="styles.css"></head>
<body class="pb-24">
<header class="header"><div><h1 class="font-bold text-sm">🌿 Inspecciones Ambientales</h1><p class="text-[11px] opacity-80">CSS independiente - v7</p></div><span class="bg-white text-green-900 px-2 py-1 rounded text-[11px] font-bold">ADMIN</span></header>
<div id="p1" class="p-3"><div class="card space-y-3"><h2 class="font-bold text-sm">Información General</h2><label class="text-xs font-bold">Área / Planta</label><select id="planta" onchange="cargarSub()" class="input"></select><label class="text-xs font-bold">Subárea</label><select id="subarea" onchange="asignarResp()" class="input"></select><label class="text-xs font-bold">Responsable</label><select id="responsable" onchange="asignarCorreo()" class="input"></select><label class="text-xs font-bold">Correo</label><input id="correo" class="input"><label class="text-xs font-bold">Fecha</label><input id="fecha" type="date" class="input"><button onclick="getGPS()" class="input text-left">📍 <span id="gpsText">Ubicación GPS</span></button><button onclick="showStep(2)" class="btn-green">Continuar → Hallazgos</button></div></div>
<div id="p2" class="p-3 hidden"><div class="card space-y-3"><div class="flex gap-2 items-center"><button onclick="showStep(1)">←</button><h2 class="font-bold text-sm">Hallazgos ambientales</h2></div><button onclick="document.getElementById('foto').click()" class="btn-dash">📷 Agregar foto</button><input type="file" id="foto" accept="image/*" capture="environment" class="hidden"><img id="preview" class="hidden w-full rounded"><textarea id="desc" class="input" placeholder="Describe hallazgo..."></textarea><div class="flex gap-2"><button onclick="setSev('Leve')" id="sLeve" class="sev">Leve</button><button onclick="setSev('Medio')" id="sMedio" class="sev">Medio</button><button onclick="setSev('Crítico')" id="sCrit" class="sev">Crítico</button></div><input id="ubic" class="input" placeholder="Ubicación"><select id="tipo" class="input"><option>Residuos</option><option>Emisiones</option><option>Aguas</option><option>Ruido</option><option>Suelo</option></select><button onclick="addHallazgoTemp()" class="btn-green">+ Guardar hallazgo</button><div id="listaTemp" class="space-y-2"></div><button onclick="guardarTodo()" class="btn-green">💾 GUARDAR INSPECCIÓN</button></div></div>
<div id="p3" class="p-3 hidden space-y-3">
<div class="card"><h2 class="font-bold text-sm">Dashboard - Filtros</h2><div class="grid grid-cols-2 gap-2 mt-2 text-xs"><div><label>División</label><select id="fDiv" onchange="renderDash()" class="input"></select></div><div><label>Área</label><select id="fArea" onchange="renderDash()" class="input"></select></div><div><label>Responsable</label><select id="fResp" onchange="renderDash()" class="input"></select></div><div><label>Fecha</label><input type="date" id="fFecha" onchange="renderDash()" class="input"></div></div></div>
<div class="card"><h3 class="font-bold text-sm">Estadísticas por División y Área</h3><div class="flex gap-2"><div class="flex-1 text-xs space-y-1" id="statDiv"></div><div class="w-[110px] text-center"><div class="stat-circle"><span id="perc">74%</span></div><p class="text-[11px]">Puntaje general</p></div></div></div>
<div class="card"><h3 class="font-bold text-sm">Inspecciones visibles para todos</h3><div id="listaAll" class="space-y-2 mt-2"></div></div>
<div class="card" style="background:#1a4d2e;color:white"><h3 class="font-bold text-sm">Panel de Administrador</h3><p class="text-[11px] opacity-80">Actualizar Listas</p><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="gestionDiv()" class="bg-white/20 py-2 rounded text-xs">Divisiones</button><button onclick="gestionArea()" class="bg-white/20 py-2 rounded text-xs">Áreas</button><button onclick="gestionResp()" class="bg-white/20 py-2 rounded text-xs">Responsables</button><button onclick="gestionCorr()" class="bg-white/20 py-2 rounded text-xs">Correos</button></div><div id="adminEdit" class="mt-2 text-xs"></div></div>
</div>
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex"><button id="b1" onclick="showStep(1)" class="flex-1 py-3 text-xs font-bold tab-active">Inicio</button><button id="b2" onclick="showStep(2)" class="flex-1 py-3 text-xs font-bold">Inspecciones</button><button id="b3" onclick="showStep(3)" class="flex-1 py-3 text-xs font-bold">Admin</button></nav>
<script src="app.js"></script></body></html>
