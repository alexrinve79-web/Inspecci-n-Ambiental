<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspeccion Ambiental FULL CRUD</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>.tab-active{background:#15803d;color:white}</style></head>
<body class="bg-gray-100 pb-24">
<header class="bg-green-700 text-white p-4 sticky top-0 z-10 flex justify-between items-center"><div><h1 class="font-bold">🌿 Inspección Ambiental FULL</h1><p class="text-xs">Acería • CRUD + Cámara + Listas</p></div><span class="text-xs bg-white text-green-700 px-2 py-1 rounded">v3 FULL</span></header>
<div id="s1" class="p-3"><div class="bg-white rounded-xl shadow p-4 space-y-3">
<h2 class="font-bold">📝 Nueva Inspección</h2>
<label class="text-xs">Planta / Área</label><div class="flex gap-2"><select id="planta" class="flex-1 border rounded p-2"></select><button onclick="addPlanta()" class="bg-gray-200 px-2 rounded">+</button></div>
<label class="text-xs">Responsable</label><input id="responsable" class="w-full border rounded p-2">
<label class="text-xs">Tipo</label><div class="flex gap-2"><select id="tipo" class="flex-1 border rounded p-2"></select><button onclick="addTipo()" class="bg-gray-200 px-2 rounded">+</button></div>
<label class="text-xs">Hallazgo</label><textarea id="hallazgo" class="w-full border rounded p-2"></textarea>
<div class="flex gap-2"><select id="nivel" class="flex-1 border rounded p-2"><option>Leve</option><option>Moderado</option><option>Crítico</option></select><button onclick="getGPS()" class="flex-1 bg-blue-600 text-white rounded p-2">📍 GPS</button></div>
<p id="gpsText" class="text-xs text-gray-500">GPS: no capturado</p>
<label class="text-xs font-bold">Foto con cámara</label>
<input type="file" id="foto" accept="image/*" capture="environment" class="w-full text-sm">
<button onclick="document.getElementById('foto').click()" class="w-full bg-orange-500 text-white py-2 rounded">📸 TOMAR FOTO CON CÁMARA</button>
<img id="preview" class="hidden w-full rounded">
<button onclick="guardar()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl">💾 GUARDAR</button>
</div></div>
<div id="s2" class="p-3 hidden"><h2 class="font-bold mb-2">📋 Historial</h2><input oninput="renderHistorial(this.value)" placeholder="Buscar..." class="w-full border rounded p-2 mb-2"><div id="lista" class="space-y-3"></div></div>
<div id="s3" class="p-3 hidden">
<div id="login" class="bg-white p-4 rounded-xl shadow"><h2 class="font-bold">🔒 Admin CRUD</h2><p class="text-xs">Clave: 1234</p><input id="clave" type="password" class="w-full border rounded p-2 mt-2"><button onclick="entrar()" class="w-full bg-green-700 text-white py-2 rounded mt-2">Entrar</button></div>
<div id="panel" class="hidden space-y-3"><div class="bg-white p-4 rounded-xl shadow"><h2 class="font-bold">⚙️ ADMIN - CRUD Total</h2><p class="text-sm">Total: <b id="total"></b></p><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="exportarExcel()" class="bg-emerald-600 text-white py-2 rounded text-sm">📊 Excel</button><button onclick="exportarTodoPDF()" class="bg-black text-white py-2 rounded text-sm">📄 PDF Total</button><button onclick="gestionListas()" class="bg-blue-600 text-white py-2 rounded text-sm">📋 Editar Listas</button><button onclick="borrarTodo()" class="bg-red-600 text-white py-2 rounded text-sm">🗑️ Borrar Todo</button></div><div id="listasEdit" class="mt-3 hidden border-t pt-2"><p class="text-xs font-bold">Plantas:</p><div id="plantasEdit" class="flex flex-wrap gap-1"></div><p class="text-xs font-bold mt-2">Tipos:</p><div id="tiposEdit" class="flex flex-wrap gap-1"></div></div></div><div id="adminLista" class="space-y-2"></div></div>
</div>
<div id="modal" class="hidden fixed inset-0 bg-black/60 p-4 flex items-center justify-center z-20"><div class="bg-white rounded-xl p-4 w-full max-w-md space-y-2"><h3 class="font-bold">Editar Inspección</h3><input id="e_planta" class="w-full border rounded p-2"><input id="e_resp" class="w-full border rounded p-2"><textarea id="e_hall" class="w-full border rounded p-2"></textarea><select id="e_nivel" class="w-full border rounded p-2"><option>Leve</option><option>Moderado</option><option>Crítico</option></select><div class="flex gap-2"><button onclick="saveEdit()" class="flex-1 bg-green-600 text-white py-2 rounded">Guardar</button><button onclick="document.getElementById('modal').classList.add('hidden')" class="flex-1 bg-gray-300 py-2 rounded">Cerrar</button></div></div></div>
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex"><button id="b1" onclick="show(1)" class="flex-1 py-3 text-sm font-bold tab-active">📝 Inspección</button><button id="b2" onclick="show(2)" class="flex-1 py-3 text-sm font-bold">📋 Historial</button><button id="b3" onclick="show(3)" class="flex-1 py-3 text-sm font-bold">⚙️ Admin CRUD</button></nav>
<script src="app.js"></script>
</body></html>
