<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspecciones v11 FINAL</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#f2f0eb;font-family:Arial,sans-serif;padding-bottom:80px}
.header{background:#1a4d2e;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:15px}.header p{font-size:11px;opacity:.8}.badge{background:#fff;color:#1a4d2e;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:800}
.page{padding:12px;max-width:600px;margin:auto}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.input{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;background:#f9fafb;font-size:14px;display:block}
label{font-size:12px;font-weight:700}
.btn-green{background:#1a4d2e;color:#fff;font-weight:700;padding:13px;border:none;border-radius:10px;width:100%;cursor:pointer}
.btn-dash{border:2px dashed #bbb;border-radius:10px;padding:14px;width:100%;background:#fff}
.row{display:flex;gap:8px}.sev{flex:1;border:1px solid #ddd;border-radius:999px;padding:8px;background:#fff}
.sev-on{background:#1a4d2e!important;color:#fff!important}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex}
.bottomnav button{flex:1;padding:14px;border:none;background:#fff;font-weight:700;cursor:pointer}
.bottomnav .tab-active{background:#1a4d2e;color:#fff}
.hidden{display:none!important}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header"><div><h1>🌿 Inspecciones Ambientales v11</h1><p>FINAL - CSS adentro + afuera</p></div><span class="badge">ADMIN</span></header>
<div id="p1" class="page"><div class="card"><h2>Información General</h2><label>Área / Planta</label><select id="planta" onchange="cargarSub()" class="input"></select><label>Subárea / Zona</label><select id="subarea" onchange="asignarResp()" class="input"></select><label>Responsable</label><select id="responsable" onchange="asignarCorreo()" class="input"></select><label>Correo</label><input id="correo" class="input"><label>Fecha</label><input id="fecha" type="date" class="input"><button onclick="getGPS()" class="input">📍 <span id="gpsText">Ubicación GPS</span></button><button onclick="showStep(2)" class="btn-green">Continuar → Hallazgos</button></div></div>
<div id="p2" class="page hidden"><div class="card"><h2>Hallazgos ambientales</h2><button onclick="document.getElementById('foto').click()" class="btn-dash">📷 Agregar foto</button><input type="file" id="foto" accept="image/*" class="hidden"><img id="preview" class="hidden" style="width:100%;border-radius:8px"><textarea id="desc" class="input" placeholder="Describe hallazgo..."></textarea><div class="row"><button onclick="setSev('Leve')" id="sLeve" class="sev">Leve</button><button onclick="setSev('Medio')" id="sMedio" class="sev">Medio</button><button onclick="setSev('Crítico')" id="sCrit" class="sev">Crítico</button></div><input id="ubic" class="input" placeholder="Ubicación"><select id="tipo" class="input"><option>Residuos</option><option>Emisiones</option><option>Aguas</option><option>Ruido</option><option>Suelo</option></select><button onclick="addHallazgoTemp()" class="btn-green">+ Guardar hallazgo</button><div id="listaTemp"></div><button onclick="guardarTodo()" class="btn-green">💾 GUARDAR INSPECCIÓN</button></div></div>
<div id="p3" class="page hidden"><div class="card"><h2>Dashboard - Filtros</h2><label>División</label><select id="fDiv" onchange="renderDash()" class="input"></select><label>Área</label><select id="fArea" onchange="renderDash()" class="input"></select><div id="statDiv"></div></div><div class="card"><h3>Inspecciones visibles para todos</h3><div id="listaAll"></div></div><div class="card" style="background:#1a4d2e;color:white"><h3>Panel Admin</h3><div style="display:flex;gap:6px"><button onclick="gestionDiv()" style="flex:1;padding:8px;border-radius:8px;border:none">Divisiones</button><button onclick="gestionArea()" style="flex:1;padding:8px;border-radius:8px;border:none">Áreas</button><button onclick="gestionResp()" style="flex:1;padding:8px;border-radius:8px;border:none">Resp.</button></div><div id="adminEdit"></div></div></div>
<nav class="bottomnav"><button id="b1" onclick="showStep(1)" class="tab-active">Inicio</button><button id="b2" onclick="showStep(2)">Inspecciones</button><button id="b3" onclick="showStep(3)">Admin</button></nav>
<script src="app.js"></script></body></html>
