<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Inspección Ambiental</title>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root {
      --green-dark: #123F22;
      --green-mid: #1B5630;
      --green-soft: #E8F2EC;
      --green-pill: #D8ECDF;
      --bg-app: #F3F6F4;
      --white: #FFFFFF;
      --text-main: #142118;
      --text-muted: #5C6E63;
      --border: #DCE5DF;
      --danger: #C62828;
      --danger-soft: #FDECEC;
      --warning: #C98A00;
      --warning-soft: #FFF7E0;
      --success: #1B7A3E;
      --success-soft: #E6F5EC;
      --radius-card: 18px;
      --radius-input: 12px;
      --radius-pill: 999px;
      --shadow: 0 6px 20px rgba(18, 63, 34, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #E4EBE6;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: var(--bg-app);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
      overflow-x: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 84px;
    }

    .screen.active {
      display: flex;
    }

    /* Top Header */
    .top-header {
      background: var(--green-dark);
      color: var(--white);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: var(--white);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .badge-admin {
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
    }
